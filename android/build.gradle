allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// NOTE: AGP is pinned to 7.4.2 (settings.gradle) because
// flutter_bluetooth_serial does not declare an AGP namespace; AGP 7.x
// falls back to the manifest package attribute, AGP 8+ would fail.

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
