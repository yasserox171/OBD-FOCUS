allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// Old plugins (flutter_bluetooth_serial) declare an outdated compileSdk
// while their merged androidx dependencies need 31+ ("android:attr/lStar
// not found"). Force a modern compileSdk on every plugin library.
// Must be registered BEFORE the evaluationDependsOn(":app") block below,
// which eagerly evaluates :app during root configuration.
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion 34
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

// NOTE: AGP is pinned to 7.4.2 (settings.gradle) because
// flutter_bluetooth_serial does not declare an AGP namespace; AGP 7.x
// falls back to the manifest package attribute, AGP 8+ would fail.

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
