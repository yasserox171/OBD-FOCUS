name: focus_obd2_scanner
description: >-
  Focus OBD2 Scanner — a professional, modern car diagnostics app that
  connects to ELM327 OBD2 adapters over Bluetooth. Offline-first, bilingual
  (Arabic / English), with live dashboards, DTC management, history charts,
  daily PDF reports, WhatsApp sharing and Google Drive backup.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Bluetooth (classic SPP — ELM327 adapters)
  flutter_bluetooth_serial: ^0.4.0

  # Storage
  sqflite: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0

  # Reports & sharing
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^9.0.0

  # Google Drive backup
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.1

  # Notifications & scheduling
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Platform
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
